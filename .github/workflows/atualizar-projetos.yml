name: Atualizar projetos do perfil

on:
  schedule:
    - cron: '0 */6 * * *'      # a cada 6 horas
  workflow_dispatch:            # botão "Run workflow"
  push:
    paths:
      - '.github/workflows/atualizar-projetos.yml'

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar a tabela de projetos
        env:
          GH_TOKEN: ${{ github.token }}
          USUARIO: ${{ github.repository_owner }}
        run: |
          python3 - << 'PY'
          import json, os, re, urllib.request
          user = os.environ["USUARIO"]
          token = os.environ["GH_TOKEN"]
          # Nomes bonitos e descrições curadas (ajuste só no perfil, não nos repos)
          NOMES = {
              "zek-music": "Zek Music",
              "zekflix": "ZekFlix",
              "zek-download-windows": "Zek Download (Windows)",
              "zek-download": "Zek Download (Linux)",
              "luz-teclado": "Luz do Teclado",
          }
          DESCRICOES = {
              "zek-music": "Player de músicas leve: cada pasta vira uma playlist. Feito em Rust (egui).",
              "zekflix": "Seus filmes e séries locais em interface estilo Netflix. Python (PyQt6) + player mpv.",
              "zek-download-windows": "Baixe vídeos/áudio de milhares de sites — versão **Windows**, em Rust (yt-dlp).",
              "zek-download": "Baixe vídeos/áudio de milhares de sites — versão **Linux**, em Python (yt-dlp).",
              "luz-teclado": "Liga/desliga a luz de fundo de teclados genéricos no Linux, sem terminal. Rust.",
          }
          url = f"https://api.github.com/users/{user}/repos?per_page=100&type=owner&sort=created&direction=desc"
          req = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
          })
          repos = json.load(urllib.request.urlopen(req))
          linhas = []
          for r in repos:
              if r["fork"] or r["archived"] or r["private"]:
                  continue
              nome_key = r["name"].lower()
              if nome_key == user.lower():          # repo do perfil
                  continue
              if nome_key.endswith(".github.io"):    # repo do site (GitHub Pages)
                  continue
              if "sem-perfil" in (r.get("topics") or []):
                  continue
              nome = NOMES.get(nome_key, r["name"].replace("-", " ").replace("_", " ").title())
              desc = DESCRICOES.get(nome_key, (r.get("description") or "")).replace("|", "\\|")
              linhas.append(f"| [{nome}]({r['html_url']}) | {desc} |")
          tabela = "| Projeto | O que faz |\n|---|---|\n" + "\n".join(linhas)
          texto = open("README.md", encoding="utf-8").read()
          novo = re.sub(
              r"(<!-- PROJETOS:START -->).*?(<!-- PROJETOS:END -->)",
              lambda m: m.group(1) + "\n" + tabela + "\n" + m.group(2),
              texto, flags=re.S)
          if novo != texto:
              open("README.md", "w", encoding="utf-8").write(novo)
          PY

      - name: Salvar se mudou
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Atualiza lista de projetos"
            git push
          fi
